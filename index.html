<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caaluza Statue Generator</title>
  <style>
    :root {
      --bg: #f8f8f8;
      --card: #fff;
      --border: #ccc;
      --accent: #2060c0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: #222;
    }

    header {
      background: var(--accent);
      color: #fff;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    header h1 {
      font-size: 1.3rem;
    }

    header .version {
      font-size: 0.75rem;
      opacity: 0.7;
    }

    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 16px;
      padding: 16px;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    /* ---- Form panel ---- */
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .panel h2 {
      font-size: 1rem;
      margin-bottom: 12px;
    }

    .field {
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .field label {
      font-size: 0.82rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .field input[type=number],
    .field select {
      padding: 4px 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
      width: 100%;
    }

    .field-row {
      display: flex;
      gap: 6px;
      align-items: end;
    }

    .field-row .field {
      flex: 1;
    }

    .field-check {
      flex-direction: row;
      align-items: center;
      gap: 6px;
    }

    button {
      cursor: pointer;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    button:hover {
      opacity: 0.9;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .share-status {
      margin-top: 8px;
      min-height: 1.2em;
      color: #52606d;
      font-size: 0.8rem;
    }

    .share-group {
      margin-top: 12px;
      display: grid;
      gap: 8px;
    }

    .share-group-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: #52606d;
    }

    .share-button-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .share-button-grid button[hidden] {
      display: none;
    }

    .share-status.error {
      color: #9d2f2f;
    }

    .analysis-box {
      margin-top: 16px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #f1f4f7;
      display: grid;
      gap: 8px;
    }

    .analysis-head {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      align-items: baseline;
    }

    .analysis-title {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .analysis-title strong {
      font-size: 1rem;
    }

    .analysis-muted {
      color: #52606d;
      font-size: 0.82rem;
    }

    .analysis-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 12px;
      font-size: 0.84rem;
    }

    .analysis-grid .label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #52606d;
      font-size: 0.75rem;
    }

    .analysis-grid .value {
      display: block;
      font-weight: 600;
      margin-top: 2px;
    }

    .btn-sm {
      padding: 4px 8px;
      font-size: 0.8rem;
      background: #666;
    }

    /* ---- Tooltip icon ---- */
    .info {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #aaa;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      cursor: help;
      position: relative;
      flex-shrink: 0;
    }

    .info:hover::after {
      content: attr(data-tip);
      position: absolute;
      left: 20px;
      top: -4px;
      background: #333;
      color: #fff;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 400;
      white-space: normal;
      line-height: 1.35;
      width: min(360px, calc(100vw - 56px));
      max-width: calc(100vw - 56px);
      min-width: 240px;
      text-transform: none;
      letter-spacing: normal;
      z-index: 10;
      pointer-events: none;
    }

    /* ---- 3D view ---- */
    #three-container {
      width: 100%;
      height: clamp(500px, 65vh, 800px);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    body.map-only header,
    body.map-only .panel,
    body.blueprint-only header,
    body.blueprint-only .panel {
      display: none;
    }

    body.map-only .layout,
    body.blueprint-only .layout {
      grid-template-columns: 1fr;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    body.map-only .outputs,
    body.blueprint-only .outputs {
      grid-column: auto;
    }

    body.blueprint-only #three-container,
    body.blueprint-only #solutions-title,
    body.blueprint-only #snap-grid {
      display: none;
    }

    body.blueprint-only #blueprint-title {
      text-align: center;
    }

    body.blueprint-only .bp-grid {
      grid-template-columns: minmax(280px, 720px);
      justify-content: center;
    }

    /* ---- Outputs below ---- */
    .outputs {
      grid-column: 1 / -1;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 20px 0 10px;
    }

    .bp-grid,
    .snap-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }

    .bp-grid canvas,
    .snap-grid img {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
    }

    .card-label {
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    @media print {

      header,
      .panel,
      #three-container,
      .snap-grid,
      .section-title,
      .btn-row {
        display: none !important;
      }

      .outputs {
        display: block !important;
      }

      .bp-grid {
        display: block !important;
      }

      .bp-grid>div {
        page-break-inside: avoid;
        margin-bottom: 16px;
      }

      .bp-grid canvas {
        width: 100% !important;
        max-width: 600px;
      }
    }
  </style>
    <script data-goatcounter="https://akerlund.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>

<body>

  <header>
    <h1>Caaluza Statue Generator</h1>
    <span class="version">v0.1.0 (2026-04-28)</span>
  </header>

  <div class="layout">
    <!-- Left panel: parameters -->
    <div class="panel">
      <h2>Parameters</h2>

      <div class="field">
        <label>Seed <span class="info"
            data-tip="Deterministic seed — same number always produces the same puzzle">?</span></label>
        <input type="number" id="seed" value="42">
      </div>

      <div class="field-row">
        <div class="field"><label>Plate Length <span class="info"
              data-tip="Base plate size along X axis (in studs)">?</span></label><input type="number" id="plateLength"
            value="8" min="2" max="32"></div>
        <div class="field"><label>Plate Width <span class="info"
              data-tip="Base plate size along Z axis (in studs)">?</span></label><input type="number" id="plateWidth"
            value="8" min="2" max="32"></div>
      </div>

      <div class="field"><label>Block Count <span class="info"
        data-tip="Target number of blocks to place (max 28 = 7 shapes × 4 colors)">?</span></label><input
          type="number" id="brickCount" value="16" min="1" max="28"></div>

      <div class="field-row">
          <div class="field"><label>Min Height <span class="info"
            data-tip="Climbing bias target — blocks prefer stacking upward until this layer is reached">?</span></label><input
        type="number" id="minHeight" value="4" min="0" max="20"></div>
        <div class="field"><label>Max Height <span class="info"
            data-tip="Hard ceiling — no block can be placed at or above this layer">?</span></label><input
        type="number" id="maxHeight" value="10" min="0" max="20"></div>
      </div>

      <div class="field"><label>Max Extent <span class="info"
          data-tip="How far blocks may overhang past the plate edge (0 = no overhang, −1 = unlimited)">?</span></label><input
          type="number" id="maxExtent" value="1" min="-1" max="10"></div>
        <div class="field"><label>Max Blocks / Layer <span class="info"
          data-tip="Cap on how many blocks can share the same vertical layer (0 = unlimited)">?</span></label><input
          type="number" id="maxBricksPerLayer" value="6" min="0" max="28"></div>

      <div class="field">
        <label>Players <span class="info"
            data-tip="How many players participate — controls which blueprints and 3D labels are produced">?</span></label>
        <select id="playerCount">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4" selected>4</option>
        </select>
      </div>

      <div class="field">
        <label>Difficulty <span class="info"
            data-tip="1 = single cluster, 2 = two disjoint clusters, 3 = three disjoint clusters">?</span></label>
        <select id="difficulty">
          <option value="1" selected>1 — Single cluster</option>
          <option value="2">2 — Two clusters</option>
          <option value="3">3 — Three clusters</option>
        </select>
      </div>

      <div class="field field-check">
        <input type="checkbox" id="forceConnected" checked>
        <label for="forceConnected">Force Connected <span class="info"
        data-tip="Every block must be face-adjacent to an existing block (always on at difficulty ≥ 2)">?</span></label>
      </div>

      <div class="btn-row">
        <button id="btn-generate">Generate</button>
        <button id="btn-randomize">🎲 Randomize</button>
        <button class="btn-sm" id="btn-pdf">📄 Save to PDF</button>
      </div>

      <div class="share-group">
        <div class="share-group-title">Blueprint URLs</div>
        <div class="share-button-grid" id="share-button-grid">
          <button class="btn-sm share-player-btn" data-player="0">🔗 Caaluza URL</button>
          <button class="btn-sm share-player-btn" data-player="1">🔗 Oedan URL</button>
          <button class="btn-sm share-player-btn" data-player="2">🔗 Sigarus URL</button>
          <button class="btn-sm share-player-btn" data-player="3">🔗 Alx URL</button>
        </div>
      </div>

      <div class="share-status" id="share-status"></div>

      <div class="analysis-box" id="analysis-summary">
        <div class="analysis-muted">Generate a puzzle to estimate solve moves and difficulty.</div>
      </div>
    </div>

    <!-- Right: 3D view -->
    <div>
      <div id="three-container"></div>
    </div>

    <!-- Full-width outputs -->
    <div class="outputs">
      <div class="section-title" id="blueprint-title">Player Blueprints</div>
      <div class="bp-grid" id="bp-grid">
        <div>
          <div class="card-label">Caaluza (−Z)</div><canvas id="bp1"></canvas>
        </div>
        <div>
          <div class="card-label">Oedan (+X)</div><canvas id="bp2"></canvas>
        </div>
        <div>
          <div class="card-label">Sigarus (top)</div><canvas id="bp3"></canvas>
        </div>
        <div>
          <div class="card-label">Alx (−X)</div><canvas id="bp4"></canvas>
        </div>
      </div>

      <div class="section-title" id="solutions-title">Solution Views</div>
      <div class="snap-grid" id="snap-grid">
        <div>
          <div class="card-label">Caaluza — corner view</div><img id="snap1">
        </div>
        <div>
          <div class="card-label">Oedan — corner view</div><img id="snap2">
        </div>
        <div>
          <div class="card-label">Sigarus — corner view</div><img id="snap3">
        </div>
        <div>
          <div class="card-label">Alx — corner view</div><img id="snap4">
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="./js/types.js"></script>
  <script src="./js/rng.js"></script>
  <script src="./js/mapgenerator.js"></script>
  <script src="./js/blueprint.js"></script>
  <script src="./js/puzzle-analyzer.js"></script>
  <script src="./js/renderer3d.js"></script>

  <script>

    const ANALYSIS_MAX_MS = 5000;
  const VERSION = '0.1.0';
  const VERSION_DATE = '2026-04-28';
  const VERSION_LABEL = 'v' + VERSION + ' (' + VERSION_DATE + ')';
    const PLAYER_NAMES = ['Caaluza', 'Oedan', 'Sigarus', 'Alx'];
    const VIEW_MODE_APP = 'app';
    const VIEW_MODE_MAP = 'map';
    const VIEW_MODE_BLUEPRINT = 'blueprint';
    const PARAM_DEFS = [
      { key: 'seed', id: 'seed', type: 'number' },
      { key: 'plateLength', id: 'plateLength', type: 'number' },
      { key: 'plateWidth', id: 'plateWidth', type: 'number' },
      { key: 'brickCount', id: 'brickCount', type: 'number' },
      { key: 'minHeight', id: 'minHeight', type: 'number' },
      { key: 'maxHeight', id: 'maxHeight', type: 'number' },
      { key: 'maxExtent', id: 'maxExtent', type: 'number' },
      { key: 'maxBricksPerLayer', id: 'maxBricksPerLayer', type: 'number' },
      { key: 'playerCount', id: 'playerCount', type: 'number' },
      { key: 'difficulty', id: 'difficulty', type: 'number' },
      { key: 'forceConnected', id: 'forceConnected', type: 'boolean' },
    ];

    // Block palette: BrickColor → {r,g,b,a}
    const brickPalette = new Map([
      [BrickColor.Yellow, { r: 245, g: 197, b: 66, a: 255 }],
      [BrickColor.Red, { r: 212, g: 32, b: 32, a: 255 }],
      [BrickColor.Green, { r: 45, g: 142, b: 45, a: 255 }],
      [BrickColor.Blue, { r: 32, g: 96, b: 192, a: 255 }],
    ]);
    const plateBodyColor = { r: 140, g: 140, b: 140, a: 255 };
    const plateStudColor = { r: 160, g: 160, b: 160, a: 255 };
    const paperColor     = { r: 255, g: 250, b: 240, a: 255 };
    const outlineColor   = { r: 40,  g: 40,  b: 40,  a: 255 };

    // CSS colour strings for canvas 2D drawing (inventory tiles).
    const brickCSS = new Map();
    brickPalette.forEach(function(rgba, color) {
      brickCSS.set(color, 'rgb(' + rgba.r + ',' + rgba.g + ',' + rgba.b + ')');
    });

    // Last generated state, needed by PDF handler.
    var _lastBricks = null, _lastParams = null, _lastAnalysis = null;
    var _runBusy = false, _runPending = false, _runVersion = 0;
    var _viewMode = VIEW_MODE_APP;
    var _blueprintPlayerIndex = null;

    function getParams() {
      return {
        seed: parseInt(document.getElementById('seed').value) || 0,
        brickCount: parseInt(document.getElementById('brickCount').value) || 12,
        minHeight: parseInt(document.getElementById('minHeight').value) || 0,
        maxHeight: parseInt(document.getElementById('maxHeight').value) || 6,
        maxExtent: parseInt(document.getElementById('maxExtent').value),
        maxBricksPerLayer: parseInt(document.getElementById('maxBricksPerLayer').value) || 0,
        forceConnected: document.getElementById('forceConnected').checked,
        playerCount: parseInt(document.getElementById('playerCount').value) || 4,
        difficulty: parseInt(document.getElementById('difficulty').value) || 1,
        plateLength: parseInt(document.getElementById('plateLength').value) || 8,
        plateWidth: parseInt(document.getElementById('plateWidth').value) || 8,
      };
    }

    function setShareStatus(message, isError) {
      const node = document.getElementById('share-status');
      if (!node) return;
      node.textContent = message || '';
      node.classList.toggle('error', !!isError);
    }

    function clampToField(field, value) {
      let result = value;
      const minValue = parseInt(field.min, 10);
      const maxValue = parseInt(field.max, 10);
      if (Number.isFinite(minValue)) result = Math.max(result, minValue);
      if (Number.isFinite(maxValue)) result = Math.min(result, maxValue);
      return result;
    }

    function setNumberFieldFromQuery(field, rawValue) {
      if (rawValue === null || rawValue === '') return;
      const value = parseInt(rawValue, 10);
      if (!Number.isFinite(value)) return;
      field.value = String(clampToField(field, value));
    }

    function setBooleanFieldFromQuery(field, rawValue) {
      if (rawValue === null) return;
      field.checked = /^(1|true|yes|on)$/i.test(rawValue);
    }

    function parseBlueprintPlayer(rawValue) {
      if (rawValue === null || rawValue === '') return null;
      const value = parseInt(rawValue, 10);
      if (!Number.isFinite(value)) return null;
      return Math.max(0, Math.min(3, value));
    }

    function applyViewMode(viewMode) {
      if (viewMode === VIEW_MODE_MAP || viewMode === VIEW_MODE_BLUEPRINT) {
        _viewMode = viewMode;
      } else {
        _viewMode = VIEW_MODE_APP;
      }

      document.body.classList.toggle('map-only', _viewMode === VIEW_MODE_MAP);
      document.body.classList.toggle('blueprint-only', _viewMode === VIEW_MODE_BLUEPRINT);
    }

    function applyParamsFromUrl() {
      const params = new URLSearchParams(window.location.search);
      applyViewMode(params.get('view'));
      _blueprintPlayerIndex = parseBlueprintPlayer(params.get('blueprintPlayer'));

      for (let i = 0; i < PARAM_DEFS.length; i++) {
        const def = PARAM_DEFS[i];
        const field = document.getElementById(def.id);
        if (!field) continue;

        if (def.type === 'boolean') setBooleanFieldFromQuery(field, params.get(def.key));
        else setNumberFieldFromQuery(field, params.get(def.key));
      }
    }

    function buildMapUrl(params, viewMode, blueprintPlayerIndex) {
      const url = new URL(window.location.href);
      url.search = '';
      url.hash = '';

      for (let i = 0; i < PARAM_DEFS.length; i++) {
        const def = PARAM_DEFS[i];
        const value = params[def.key];
        url.searchParams.set(def.key, def.type === 'boolean' ? (value ? '1' : '0') : String(value));
      }

      if (viewMode === VIEW_MODE_MAP || viewMode === VIEW_MODE_BLUEPRINT)
        url.searchParams.set('view', viewMode);

      if (viewMode === VIEW_MODE_BLUEPRINT && blueprintPlayerIndex !== null && blueprintPlayerIndex !== undefined)
        url.searchParams.set('blueprintPlayer', String(blueprintPlayerIndex));

      return url.toString();
    }

    function syncCurrentUrl(params) {
      history.replaceState(null, '', buildMapUrl(params, _viewMode, _blueprintPlayerIndex));
    }

    function copyUrlWithFeedback(url, successMessage) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function() {
          setShareStatus(successMessage, false);
        }).catch(function() {
          window.prompt('Copy this URL', url);
          setShareStatus('Clipboard access was blocked, so the URL was opened in a copy dialog instead.', false);
        });
        return;
      }

      window.prompt('Copy this URL', url);
      setShareStatus('Clipboard is unavailable here, so the URL was opened in a copy dialog instead.', false);
    }

    function copyBlueprintUrl(playerIndex) {
      const url = buildMapUrl(getParams(), VIEW_MODE_BLUEPRINT, playerIndex);
      copyUrlWithFeedback(
        url,
        PLAYER_NAMES[playerIndex] + ' blueprint URL copied. Opening it will show only that blueprint.'
      );
    }

    function updateShareButtons(playerCount) {
      const buttons = document.querySelectorAll('.share-player-btn');
      for (let i = 0; i < buttons.length; i++) {
        const playerIndex = parseInt(buttons[i].getAttribute('data-player'), 10);
        buttons[i].hidden = playerIndex >= playerCount;
      }
    }

    function shouldShowBlueprintCard(playerIndex, playerCount) {
      if (playerIndex > playerCount) return false;
      if (_viewMode !== VIEW_MODE_BLUEPRINT) return true;
      return _blueprintPlayerIndex === null ? true : playerIndex === _blueprintPlayerIndex + 1;
    }

    function shouldShowSnapshotCard(playerIndex, playerCount) {
      if (_viewMode === VIEW_MODE_BLUEPRINT) return false;
      return playerIndex >= 1 && playerIndex <= 4;
    }

    function renderAnalysis(analysis) {
      const host = document.getElementById('analysis-summary');
      if (!analysis) {
        host.innerHTML = '<div class="analysis-muted">Generate a puzzle to estimate solve moves and difficulty.</div>';
        return;
      }

      function classificationTip(currentAnalysis) {
        switch (currentAnalysis.classification) {
          case 'Easy':
            return 'Easy means the solver usually had a clear next step, with very little trial and error or recovery.';
          case 'Medium':
            return 'Medium means the puzzle has some uncertainty, but the blueprints still guide most moves without many costly mistakes.';
          case 'Hard':
            return 'Hard means the solver often had to recover from wrong-looking placements, remove blocks, or deal with unstable structure.';
          case 'Very hard':
            return 'Very hard means the solver saw many competing placements or expensive recovery chains, so the puzzle needed a lot of trial, removal, or rebuilding.';
          default:
            return 'This label is a heuristic summary of the solver metrics. If the solver timed out or stayed unresolved, treat the label as less certain.';
        }
      }

      function metricCell(label, value, tip) {
        return '<div>' +
          '<span class="label">' + label + ' <span class="info" data-tip="' + tip + '">?</span></span>' +
          '<span class="value">' + value + '</span>' +
          '</div>';
      }

      host.innerHTML = [
        '<div class="analysis-head">',
        '<span class="analysis-title"><strong>' + analysis.classification + '</strong><span class="info" data-tip="' + classificationTip(analysis) + '">?</span></span>',
        '<span class="analysis-muted">' + analysis.moveCount + ' estimated moves for ' + analysis.brickCount + ' bricks</span>',
        '</div>',
        '<div class="analysis-grid">',
        metricCell('Forced placements', analysis.forcedPlacements, 'A forced placement means the solver could see only one place where the next block still matched every blueprint. More forced steps usually make the puzzle feel easier.'),
        metricCell('Ambiguous placements', analysis.ambiguousPlacements, 'An ambiguous placement means several positions still looked correct, so the solver had to test or guess between them. More ambiguous steps usually make the puzzle feel harder.'),
        metricCell('Move ratio', analysis.moveRatio.toFixed(2), 'This compares all simulated moves to block count. The move total includes normal placements, relocations, and removals. A value near 1.0 means the solver mostly placed each block once.'),
        metricCell('Max candidates', analysis.maxCandidateCount, 'This is the hardest single step: the highest number of places one block could legally go before the blueprints narrowed it down.'),
        metricCell('Average candidates', analysis.averageCandidateCount.toFixed(1), 'This is the average number of valid places considered at each step. Lower values mean the build path is more clearly guided by the blueprints.'),
        metricCell('Relocations', analysis.relocationCount, 'A relocation happens when the solver keeps the same physical block but moves it from a wrong spot directly to its target spot in one recovery move.'),
        metricCell('Removals', analysis.removalCount, 'A removal happens when a wrong block has to be taken out of the build instead of being moved straight to the correct position.'),
        metricCell('Breaking moves', analysis.breakingMoveCount, 'These are recovery moves that made one or more already placed blocks lose support and drop out of the build.'),
        metricCell('Fallen pieces', analysis.totalFallenPieces, 'This counts every block that lost support and fell after another block was moved or removed.'),
        metricCell('Largest fall', analysis.maxFallenPieces, 'This is the biggest single collapse: the highest number of blocks that fell because of one move.'),
        metricCell('Solver status', analysis.solverStatus, 'Solved means the heuristic solver found a full build order, including recovery moves when a wrong placement blocked progress. Timed out means the solver stopped when it hit the analysis time budget so the page would stay responsive. Unresolved means the solver stopped for another reason before finishing.'),
        '</div>'
      ].join('');
    }

    function run(done) {
      const p = getParams();
      const runVersion = ++_runVersion;
      syncCurrentUrl(p);

      // 1. Generate blocks.
      const bricks = generate(
        p.seed, p.brickCount, p.minHeight, p.maxHeight, p.maxExtent,
        p.maxBricksPerLayer, p.forceConnected, p.difficulty, p.plateLength, p.plateWidth
      );
      _lastBricks = bricks;
      _lastParams = p;
      _lastAnalysis = analyzePuzzle(bricks, {
        playerCount: p.playerCount,
        plateLength: p.plateLength,
        plateWidth: p.plateWidth,
        maxAnalysisMs: ANALYSIS_MAX_MS,
      });
      updateShareButtons(p.playerCount);
      renderAnalysis(_lastAnalysis);

      // 2. Blueprints — only for active players; hide the rest.
      for (let pi = 1; pi <= 4; pi++) {
        const card = document.getElementById('bp' + pi).parentElement;
        if (shouldShowBlueprintCard(pi, p.playerCount)) {
          const bp = createForPlayer(
            pi, p.seed, bricks, p.plateLength, p.plateWidth,
            brickPalette, plateBodyColor, plateStudColor
          );
          bp.drawToCanvas(document.getElementById('bp' + pi), 24, paperColor, outlineColor, 1);
          card.style.display = '';
        } else {
          card.style.display = 'none';
        }
      }

      // 3. 3D scene.
      buildScene(bricks, p.plateLength, p.plateWidth, 4);

      // Mark run complete before snapshots so queue progress never depends on
      // requestAnimationFrame timing.
      if (done) done();

      // 4. Corner snapshots — always show all four directions.
      requestAnimationFrame(() => {
        if (runVersion !== _runVersion) return;

        const snaps = captureCornerSnapshots(p.plateLength, p.plateWidth, 4);
        for (let i = 0; i < 4; i++) {
          const card = document.getElementById('snap' + (i + 1)).parentElement;
          if (shouldShowSnapshotCard(i + 1, p.playerCount)) {
            document.getElementById('snap' + (i + 1)).src = snaps[i];
            card.style.display = '';
          } else {
            document.getElementById('snap' + (i + 1)).src = '';
            card.style.display = 'none';
          }
        }
      });
    }

    function scheduleRun() {
      _runPending = true;
      if (_runBusy) return;
      _runBusy = true;
      processScheduledRuns();
    }

    function processScheduledRuns() {
      if (!_runPending) {
        _runBusy = false;
        return;
      }

      _runPending = false;
      run(function() {
        if (_runPending) {
          requestAnimationFrame(processScheduledRuns);
        } else {
          _runBusy = false;
        }
      });
    }

    // Generate button: regenerate with current seed.
    document.getElementById('btn-generate').addEventListener('click', scheduleRun);

    // Randomize button: new random seed + regenerate.
    document.getElementById('btn-randomize').addEventListener('click', () => {
      document.getElementById('seed').value = Math.floor(Math.random() * 999999);
      scheduleRun();
    });

    document.querySelectorAll('.share-player-btn').forEach(function(button) {
      button.addEventListener('click', function() {
        copyBlueprintUrl(parseInt(button.getAttribute('data-player'), 10));
      });
    });

    // Pressing Enter in the seed field regenerates with that seed.
    document.getElementById('seed').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); scheduleRun(); }
    });

    // --------------------------------------------------------------------------
    // buildInventoryCanvas — top-down tile for every unique block type used.
    // --------------------------------------------------------------------------
    function buildInventoryCanvas(bricks) {
      // Group by canonical shape (long side first) + color.
      const groups = {}, order = [];
      for (const b of bricks) {
        const nL = Math.max(b.length, b.width);
        const nW = Math.min(b.length, b.width);
        const key = nL + 'x' + nW + ':' + b.color;
        if (!groups[key]) { groups[key] = { l: nL, w: nW, color: b.color, n: 0 }; order.push(key); }
        groups[key].n++;
      }

      const cell = 22, gap = 10, pad = 8, cols = 4;
      const rows  = Math.ceil(order.length / cols);
      const colW  = 4 * cell + gap;
      const rowH  = 2 * cell + gap;
      const canW  = pad + cols * colW;
      const canH  = pad + rows * rowH + pad;

      const canvas = document.createElement('canvas');
      canvas.width = canW; canvas.height = canH;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canW, canH);

      order.forEach(function(key, i) {
        const g   = groups[key];
        const col = i % cols, row = Math.floor(i / cols);
        const x0  = pad + col * colW;
        const y0  = pad + row * rowH;
        const bw  = g.l * cell, bh = g.w * cell;
        const css = brickCSS.get(g.color) || '#ff00ff';

        // Body fill.
        ctx.fillStyle = css;
        ctx.fillRect(x0, y0, bw, bh);

        // Studs as circles.
        const sr = cell * 0.28;
        for (let sx = 0; sx < g.l; sx++) {
          for (let sz = 0; sz < g.w; sz++) {
            const cx = x0 + sx * cell + cell / 2;
            const cy = y0 + sz * cell + cell / 2;
            ctx.beginPath();
            ctx.arc(cx, cy, sr, 0, Math.PI * 2);
            ctx.fillStyle = css;
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.45)';
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }

        // Body outline.
        ctx.strokeStyle = 'rgba(0,0,0,0.65)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x0 + 0.75, y0 + 0.75, bw - 1.5, bh - 1.5);
      });

      return canvas;
    }

    // --- Save to PDF ---
    document.getElementById('btn-pdf').addEventListener('click', () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
      const p = getParams();
      const seed = p.seed;

      // Page dimensions (A4 landscape).
      const pw = 297, ph = 210, m = 10;

      // --- Page 1: Blueprints ---
      doc.setFontSize(14);
      doc.text(`Caaluza Puzzle \u2014 Seed: ${seed}`, m, 12);
      doc.setFontSize(8);
      doc.text(`Blocks: ${p.brickCount}  Height: ${p.minHeight}\u2013${p.maxHeight}  Difficulty: ${p.difficulty}  Plate: ${p.plateLength}\u00d7${p.plateWidth}`, m, 18);

      const bpLabels = PLAYER_NAMES.map((n, i) => `${n} (${['\u2212Z', '+X', 'top', '\u2212X'][i]})`);
      const cols = p.playerCount <= 2 ? 1 : 2;
      const rows = Math.ceil(p.playerCount / cols);
      const cellW = cols === 1 ? (pw - 2 * m) : (pw - 3 * m) / 2;
      const cellH = rows === 1 ? (ph - 28 - 2 * m) : (ph - 28 - 3 * m) / 2;

      for (let i = 0; i < p.playerCount; i++) {
        const col = i % cols, row = Math.floor(i / cols);
        const x = m + col * (cellW + m);
        const y = 24 + row * (cellH + m);
        const canvas = document.getElementById('bp' + (i + 1));
        const aspect = canvas.width / canvas.height;
        let imgW = cellW / 2, imgH = imgW / aspect;
        if (imgH > (cellH - 6) / 2) { imgH = (cellH - 6) / 2; imgW = imgH * aspect; }
        const imgX = x + (cellW - imgW) / 2;
        const imgY = y + 6 + ((cellH - 6) - imgH) / 2;
        doc.setFontSize(9);
        doc.text(bpLabels[i], x + cellW / 2, y + 4, { align: 'center' });
        doc.addImage(canvas.toDataURL('image/png'), 'PNG', imgX, imgY, imgW, imgH);
      }

      // --- Page 2: Solution views + full parameters ---
      doc.addPage();
      doc.setFontSize(14);
      doc.text(`Solution Views \u2014 Seed: ${seed}`, m, 12);

      // Full parameter block.
      doc.setFontSize(7);
      const paramLines = [
        `Version: ${VERSION_LABEL}`,
        `Seed: ${seed}  |  Plate: ${p.plateLength}\u00d7${p.plateWidth}  |  Blocks: ${p.brickCount}  |  Players: ${p.playerCount}  |  Difficulty: ${p.difficulty}`,
        `Height: ${p.minHeight}\u2013${p.maxHeight}  |  Max Extent: ${p.maxExtent}  |  Max Blocks/Layer: ${p.maxBricksPerLayer}  |  Force Connected: ${p.forceConnected ? 'Yes' : 'No'}`,
      ];
      for (let i = 0; i < paramLines.length; i++)
        doc.text(paramLines[i], m, 18 + i * 4);

      const snapLabels = PLAYER_NAMES.map(n => `${n} — corner view`);
      const snapTop = 18 + paramLines.length * 4 + 4;
      const snapPlayerCount = 4;
      const snapCols = 2;
      const snapRows = 2;
      const snapCellW = snapCols === 1 ? (pw - 2 * m) : (pw - 3 * m) / 2;
      const snapCellH = (ph - snapTop - (snapRows > 1 ? 3 : 2) * m) / snapRows;
      const snapSize = Math.min(snapCellW, snapCellH - 6);

      for (let i = 0; i < snapPlayerCount; i++) {
        const col = i % snapCols, row = Math.floor(i / snapCols);
        const x = m + col * (snapCellW + m);
        const y = snapTop + row * (snapCellH + m);
        doc.setFontSize(9);
        doc.text(snapLabels[i], x, y);
        const src = document.getElementById('snap' + (i + 1)).src;
        if (src) doc.addImage(src, 'PNG', x, y + 2, snapSize, snapSize);
      }

      // --- Page 3: Block inventory — right half only, rotated -90° for folding ---
      doc.addPage();

      // Dashed fold guide at centre.
      doc.setDrawColor(190, 190, 190);
      doc.setLineDashPattern([3, 3], 0);
      doc.line(pw / 2, 0, pw / 2, ph);
      doc.setLineDashPattern([], 0);
      doc.setDrawColor(0, 0, 0);

      // Rotate inventory canvas -90° (counterclockwise) so content reads
      // correctly when the page is folded and held portrait with the right edge up.
      const invCan = buildInventoryCanvas(_lastBricks || []);
      const rotCan = document.createElement('canvas');
      rotCan.width  = invCan.height;
      rotCan.height = invCan.width;
      const rotCtx  = rotCan.getContext('2d');
      rotCtx.translate(0, invCan.width);
      rotCtx.rotate(-Math.PI / 2);
      rotCtx.drawImage(invCan, 0, 0);

      // Fit centred into right half with margins.
      const rHalfX = pw / 2 + m;
      const rHalfW = pw / 2 - 2 * m;
      const rHalfH = ph - 2 * m;
      const rotAsp = rotCan.width / rotCan.height;
      let rotImgW = rHalfW, rotImgH = rHalfW / rotAsp;
      if (rotImgH > rHalfH) { rotImgH = rHalfH; rotImgW = rHalfH * rotAsp; }
      const rotImgX = rHalfX + (rHalfW - rotImgW) / 2;
      const rotImgY = m + (rHalfH - rotImgH) / 2;
      doc.addImage(rotCan.toDataURL('image/png'), 'PNG', rotImgX, rotImgY, rotImgW, rotImgH);

      doc.save(`caaluza-puzzle-seed-${seed}.pdf`);
    });

    // Init 3D and auto-generate once the page (including CDN scripts) is ready.
    window.addEventListener('load', function () {
      applyParamsFromUrl();
      init3D(document.getElementById('three-container'));
      scheduleRun();
    });
  </script>

</body>
